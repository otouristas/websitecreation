name: banned-terms

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail if the owner or the old agency address is mentioned
        run: node scripts/check-banned-terms.mjs
