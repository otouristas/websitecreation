function ferry(d){const sailings=list(d.sailings).map(obj).slice(0,20),p=num(d.passengers);return `<section class="route-hero"><div class="eyebrow">${t('FERRY SEARCH','ΑΝΑΖΗΤΗΣΗ ΔΡΟΜΟΛΟΓΙΩΝ')}</div><div class="route"><div><span class="muted" style="font-size:11px">${t('From','Από')}</span><h1>${esc(str(d.from,70)||'—')}</h1></div><div class="route-line">${ferryIcon}</div><div class="destination"><span class="muted" style="font-size:11px">${t('To','Προς')}</span><h1>${esc(str(d.to,70)||'—')}</h1></div></div><div class="period" style="margin-top:16px">${esc(date(d.date))}${p!==null?' · '+fmt(p)+' '+t('travellers','ταξιδιώτες'):''}</div></section><p class="editorial">${esc(sailings.length?t('Your crossing, down to the details. Compare ships, fare categories and facilities. Departure and arrival use local port time.','Το δρομολόγιό σας, με όλες τις λεπτομέρειες. Συγκρίνετε πλοία, κατηγορίες ναύλου και παροχές. Αναχώρηση και άφιξη στην τοπική ώρα κάθε λιμανιού.'):t('No sailings were returned for this search. This does not establish that the route does not operate.','Δεν επιστράφηκαν δρομολόγια για αυτή την αναζήτηση. Αυτό δεν επιβεβαιώνει ότι η γραμμή δεν εκτελείται.'))}</p>${sailings.length?`<div class="travel-list">${sailings.map(s=>{const fare=money(s.fromPrice,s.currency),fares=list(s.accommodations).map(obj).slice(0,16),changes=num(s.changes??s.stops),photo=imageURL(s.imageURL)||list(s.images).map(imageURL).find(Boolean);return `<article class="sailing rich-sailing">${photo?image(photo,str(s.vessel)+' · '+t('provider vessel image','φωτογραφία πλοίου από τον πάροχο'),'vessel-photo'):''}<div class="sailing-body"><div class="operator"><div class="operator-identity">${image(s.operatorLogo,str(s.operator)+' '+t('logo','λογότυπο'),'operator-logo')}<div><h2>${esc(str(s.operator,100)||t('Operator not supplied','Δεν δόθηκε εταιρεία'))}</h2><p>${esc(str(s.vessel,100))}</p><div class="vessel-kind">${esc(vesselType(s.vesselType))}</div></div></div><span class="badge">${s.scheduleOnly?t('Timetable only','Μόνο ωράριο'):changes===0?t('No vessel change','Χωρίς αλλαγή πλοίου'):changes!==null?fmt(changes)+' '+(changes===1?t('change','αλλαγή'):t('changes','αλλαγές')):t('Crossing','Δρομολόγιο')}</span></div><div class="sailing-grid"><div class="times"><div class="time">${esc(clock(s.departure))}<small>${t('Departure','Αναχώρηση')}</small></div><span class="duration">${esc(typeof s.duration==='number'?fmt(s.duration)+' min':str(s.duration,35)||'—')}</span><div class="time">${esc(clock(s.arrival))}<small>${t('Arrival','Άφιξη')}${str(s.arrival).slice(0,10)!==str(s.departure).slice(0,10)?' · '+esc(date(str(s.arrival).slice(0,10))):''}</small></div></div><div class="fare"><strong>${esc(fare||t('Check fare','Έλεγχος ναύλου'))}</strong><span>${fare?t('from / person','από / άτομο'):t('No fare supplied','Δεν δόθηκε ναύλος')}</span></div></div>${fares.length?`<div class="fare-categories">${fares.slice(0,4).map(f=>`<div class="fare-category"><span>${esc(fareLabel(f))}</span><strong>${esc(money(f.price,f.currency)||'—')}</strong></div>`).join('')}</div>`:''}${services(s)}<div class="sailing-foot"><span class="muted" style="font-size:10px;line-height:1.6">${s.seaComfort?esc(t('Sea forecast: ','Πρόγνωση θάλασσας: ')+str(s.seaComfort,70)):esc(t('Recheck seats & fares with the provider','Ελέγξτε ξανά θέσεις και ναύλους στον πάροχο'))}</span>${link(s.bookingUrl,t('Check with provider','Έλεγχος στον πάροχο'),true)}</div>${sailingDetails(s)}</div></article>`}).join('')}</div>`:empty(d.unavailable?t('Ferry source unavailable','Η πηγή δρομολογίων δεν είναι διαθέσιμη'):t('No confirmed results','Χωρίς επιβεβαιωμένα αποτελέσματα'),t('Try another date or check the ferry operator.','Δοκιμάστε άλλη ημερομηνία ή ελέγξτε την ακτοπλοϊκή εταιρεία.'))}${note(d.note)}${d.source?`<p class="muted" style="font-size:10px;margin-top:14px">${t('Source','Πηγή')}: ${esc(str(d.source,120))}${d.fetchedAt?' · '+esc(str(d.fetchedAt,50)):''}</p>`:''}${note(t('From-fares per passenger, not a confirmed total or reserved seat. Recheck timetable, fare and availability with the provider. Booking links may be affiliate links; booking and payment happen on the provider’s site. Forecasts do not confirm whether a sailing will operate.','Ενδεικτικές ελάχιστες τιμές ανά άτομο, όχι επιβεβαιωμένο σύνολο ή κράτηση θέσης. Ελέγξτε ώρες, ναύλο και διαθεσιμότητα στον πάροχο. Οι σύνδεσμοι μπορεί να είναι συνεργατικοί· η κράτηση και η πληρωμή γίνονται στον ιστότοπο του παρόχου. Η πρόγνωση δεν επιβεβαιώνει την εκτέλεση του δρομολογίου.'))}`}

function guide(d){return `<div class="route-hero"><div class="eyebrow">${esc([d.region,d.country].filter(Boolean).join(' · '))}</div><h1>${esc(greek&&d.greek?d.greek:str(d.name,100))}</h1><p style="margin:0">${esc(str(d.line,300))}</p></div><p class="editorial">${esc(str(d.about,3000))}</p><div class="tags">${[obj(d.port).name,d.airport].filter(Boolean).map(v=>`<span class="tag">${esc(str(v,100))}</span>`).join('')}</div><h2>${t('Find your kind of island day','Βρείτε τη μέρα που σας ταιριάζει')}</h2><div class="island-grid">${list(d.beaches).map(obj).slice(0,6).map(b=>`<article class="item"><div class="eyebrow">${t('BEACH','ΠΑΡΑΛΙΑ')}</div><h3>${esc(str(b.name,100))}</h3><p class="muted">${esc([b.type,...list(b.vibes),b.access].filter(Boolean).join(' · '))}</p></article>`).join('')}${list(d.sunsetSpots).map(obj).slice(0,2).map(s=>`<article class="item"><div class="eyebrow">${t('SUNSET','ΗΛΙΟΒΑΣΙΛΕΜΑ')}</div><h3>${esc(str(s.name,100))}</h3><p class="muted">${esc(str(s.note,600))}</p></article>`).join('')}</div>`}
function places(d){const rows=list(d.places).map(obj).slice(0,10);return `<div class="eyebrow">${t('PLACES TO EXPLORE','ΜΕΡΗ ΓΙΑ ΕΞΕΡΕΥΝΗΣΗ')}</div><h1>${t('A place for your next stop','Η επόμενη στάση σας')}</h1>${rows.length?`<div class="island-grid">${rows.map(p=>`<article class="item"><div class="eyebrow">${esc(str(p.type,80))}</div><h3>${esc(str(p.name,200))}</h3>${num(p.rating)!==null?`<p>★ ${fmt(p.rating,1)} <span class="muted">(${fmt(p.reviews)} ${t('reviews','αξιολογήσεις')})</span></p>`:''}<p class="muted">${esc(str(p.address,250))}</p>${p.openNow===true||p.openNow===false?`<span class="tag">${p.openNow?t('Reported open now','Δηλώνεται ανοιχτό τώρα'):t('Reported closed now','Δηλώνεται κλειστό τώρα')}</span>`:''}<p style="margin-top:10px">${esc(str(p.summary,500))}</p>${link(p.googleMapsUri,t('View on map','Προβολή στον χάρτη'))}</article>`).join('')}</div>`:empty(t('No places returned','Δεν επιστράφηκαν μέρη'),t('Try a more specific destination or type of place.','Δοκιμάστε συγκεκριμένο προορισμό ή είδος μέρους.'))}${note(d.note)}`}
function events(d){const rows=list(d.events).map(obj).slice(0,40);return `<div class="eyebrow">${t('LOCAL CALENDAR','ΤΟΠΙΚΟ ΗΜΕΡΟΛΟΓΙΟ')}</div><h1>${t('Be there for the island','Ζήστε τον τόπο από κοντά')}</h1><div class="period">${esc(date(d.from))} — ${esc(date(d.to))}</div>${rows.length?`<div class="list">${rows.map(e=>`<article class="item"><div class="eyebrow">${esc(str(e.category,80))}</div><h3>${esc(str(e.title,200))}</h3><p class="muted">${esc([e.start,e.time,e.place].filter(Boolean).join(' · '))}</p>${e.approximate?note(t('Usual date — confirm locally before making plans.','Συνήθης ημερομηνία — επιβεβαιώστε τοπικά πριν οργανώσετε το πρόγραμμά σας.')):''}${link(e.sourceURL,t('Check source','Έλεγχος πηγής'))}</article>`).join('')}</div>`:empty(t('No events returned','Δεν επιστράφηκαν εκδηλώσεις'),t('This source has no events for the selected dates.','Η πηγή δεν έχει εκδηλώσεις για τις επιλεγμένες ημερομηνίες.'))}${note(d.note)}`}
function flights(d){const rows=list(d.flights).map(obj).slice(0,12);return `<section class="route-hero"><div class="eyebrow">${t('FLIGHT SEARCH','ΑΝΑΖΗΤΗΣΗ ΠΤΗΣΕΩΝ')}</div><div class="route"><h1>${esc(str(d.from,20))}</h1><div class="route-line"><span aria-hidden="true">✈</span></div><h1 class="destination">${esc(str(d.to,20))}</h1></div><div class="period" style="margin-top:14px">${esc(date(d.date))}${d.returnDate?' — '+esc(date(d.returnDate)):''} · ${fmt(d.adults)} ${t('adults','ενήλικες')}</div></section>${rows.length?`<div class="travel-list">${rows.map(f=>{const outbound=obj(f.outbound),segments=list(outbound.segments).map(obj),first=segments[0]||{},last=segments.at(-1)||{};return `<article class="sailing"><div class="operator"><div><h2>${esc(str(f.airline,100))}</h2><p>${esc([f.cabin,first.flightNumber].filter(Boolean).join(' · '))}</p></div><span class="badge">${num(outbound.stops)===0?t('Nonstop','Απευθείας'):num(outbound.stops)!==null?fmt(outbound.stops)+' '+t('stops','στάσεις'):t('Flight','Πτήση')}</span></div><div class="sailing-grid"><div class="times"><div class="time">${esc(clock(first.departure))}<small>${esc(str(first.from,10))}</small></div><span class="duration">${num(outbound.durationMinutes)!==null?fmt(outbound.durationMinutes)+' min':'—'}</span><div class="time">${esc(clock(last.arrival))}<small>${esc(str(last.to,10))}${str(last.arrival).slice(0,10)!==str(first.departure).slice(0,10)?' · '+esc(date(str(last.arrival).slice(0,10))):''}</small></div></div><div class="fare"><strong>${esc(money(f.price,f.currency)||'—')}</strong><span>${t('all passengers · including taxes','όλοι οι επιβάτες · με φόρους')}</span></div></div><div class="tags"><span class="tag">${f.baggageIncluded===true?t('Checked bag included','Με παραδοτέα αποσκευή'):f.baggageIncluded===false?t('Checked bag not included','Χωρίς παραδοτέα αποσκευή'):t('Baggage: check fare rules','Αποσκευές: ελέγξτε τους όρους')}</span><span class="tag">${f.refundable===true?t('Refundable per provider terms','Επιστρέψιμη βάσει όρων παρόχου'):f.refundable===false?t('Non-refundable per provider','Μη επιστρέψιμη βάσει παρόχου'):t('Refund terms not supplied','Δεν δόθηκαν όροι επιστροφής')}</span></div>${f.inbound?note(t('A return journey is included in the source result. Ask the assistant for its segment details.','Η πηγή περιλαμβάνει και επιστροφή. Ζητήστε από τον βοηθό τις επιμέρους πτήσεις.')):''}</article>`}).join('')}</div>`:empty(d.unavailable?t('Flight source unavailable','Η πηγή πτήσεων δεν είναι διαθέσιμη'):t('No flights returned','Δεν επιστράφηκαν πτήσεις'),t('No fare or seat availability can be confirmed from this response.','Από αυτή την απάντηση δεν επιβεβαιώνεται ναύλος ή διαθεσιμότητα θέσης.'))}${note(d.note)}${note(t('Times are local to each airport. Prices and fare rules must be rechecked before booking. No payment or reservation is made in this view.','Οι ώρες είναι τοπικές για κάθε αεροδρόμιο. Ελέγξτε ξανά τιμές και όρους πριν κάνετε κράτηση. Σε αυτή την προβολή δεν γίνεται πληρωμή ή κράτηση.'))}`}
function transfers(d){const partner=obj(d.partner),rows=list(d.vehicles).map(obj).slice(0,16);return `<div class="eyebrow">${t('LOCAL TRANSFERS','ΤΟΠΙΚΕΣ ΜΕΤΑΦΟΡΕΣ')}</div><h1>${esc(str(partner.name,120)||t('Check a local transfer','Έλεγχος τοπικής μεταφοράς'))}</h1><p class="muted">${esc([d.from,d.to].filter(Boolean).join(' → '))}</p>${d.unmatched?note(t('The requested pickup or drop-off was not matched. Confirm the exact places with the partner.','Δεν αντιστοιχίστηκε το σημείο παραλαβής ή αποβίβασης. Επιβεβαιώστε τα ακριβή σημεία με τον συνεργάτη.')):''}${rows.length?`<div class="list">${rows.map(v=>`<article class="item"><div class="item-top"><h3>${esc(str(v.name,100))}</h3><strong>${esc(money(v.price,d.currency)||(t('Price on request','Τιμή κατόπιν ερώτησης')))}</strong></div><div class="tags"><span class="tag">${num(v.seats)!==null?fmt(v.seats)+' '+t('seats','θέσεις'):t('Capacity: confirm with partner','Χωρητικότητα: επιβεβαίωση με συνεργάτη')}</span><span class="tag">${num(v.luggage)!==null?fmt(v.luggage)+' '+t('bags','αποσκευές'):t('Luggage: confirm with partner','Αποσκευές: επιβεβαίωση με συνεργάτη')}</span>${v.priceIsFrom?`<span class="tag">${t('From-price','Ελάχιστη ενδεικτική τιμή')}</span>`:''}${v.fits===false?`<span class="tag">${t('Does not fit the requested party / luggage','Δεν καλύπτει τους ζητούμενους επιβάτες / αποσκευές')}</span>`:''}</div></article>`).join('')}</div>`:empty(t('No vehicle quote returned','Δεν επιστράφηκε προσφορά οχήματος'),str(d.note)||t('Confirm the route and fare with a local partner.','Επιβεβαιώστε διαδρομή και τιμή με τοπικό συνεργάτη.'))}${note(d.note)}${link(partner.website,t('Check with local partner','Έλεγχος με τον τοπικό συνεργάτη'))}${note(t('Published fares are not a booking confirmation. Confirm vehicle capacity, pickup, luggage and final fare directly with the partner.','Οι δημοσιευμένες τιμές δεν αποτελούν επιβεβαίωση κράτησης. Επιβεβαιώστε όχημα, παραλαβή, αποσκευές και τελικό κόστος με τον συνεργάτη.'))}`}
function generic(d){return `<div class="eyebrow">${CONFIG.product==='guru'?'ANOTHERSEOGURU':'TOURISTAS AI'}</div><h1>${t('Your result','Το αποτέλεσμά σας')}</h1>${note(str(d.message)||str(d.note)||t('The assistant has the full source result.','Ο βοηθός διαθέτει το πλήρες αποτέλεσμα της πηγής.'))}<details><summary>${t('View source result','Προβολή αποτελέσματος πηγής')}</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px">${esc(JSON.stringify(d,null,2).slice(0,40000))}</pre></details>`}
function render(){if(!data)return;root.innerHTML=CONFIG.product==='guru'?data.totals?performance(data):Array.isArray(data.tasks)?tasks(data):Array.isArray(data.opportunities)||Array.isArray(data.items)?opportunities(data):generic(data):Array.isArray(data.sailings)?ferry(data):Array.isArray(data.flights)?flights(data):Array.isArray(data.beaches)?guide(data):Array.isArray(data.places)?places(data):Array.isArray(data.events)?events(data):'partner'in data?transfers(data):generic(data);document.querySelector('#footer-label').textContent=t('Source data, clearly presented','Τα δεδομένα της πηγής, ξεκάθαρα');document.querySelector('#product-link').textContent=t('Open app ↗','Άνοιγμα εφαρμογής ↗');}
function notify(method,params){if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId,timer=setTimeout(()=>{pending.delete(id);reject(new Error(t('The host did not respond.','Ο client δεν απάντησε.')))},10000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function context(c){if(c.theme==='light'||c.theme==='dark')document.documentElement.dataset.theme=c.theme;if(typeof c.locale==='string'){try{new Intl.NumberFormat(c.locale);locale=c.locale;greek=locale.toLowerCase().startsWith('el');document.documentElement.lang=locale}catch{}}render()}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.source===window)return;const m=obj(event.data);if(m.jsonrpc!=='2.0')return;if(typeof m.id==='number'&&pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(new Error(str(obj(m.error).message,300))):p.resolve(m.result);return}if(m.method==='ui/notifications/host-context-changed')context(obj(m.params));if(m.method==='ui/notifications/tool-result'){const r=obj(m.params);status.textContent='';if(r.isError){root.innerHTML=empty(t('The source could not complete the request','Η πηγή δεν ολοκλήρωσε το αίτημα'),str(obj(list(r.content)[0]).text,700)||t('Please try again.','Δοκιμάστε ξανά.'));return}const value=obj(r.structuredContent);if(Object.keys(value).length){data=value;render()}}if(m.method==='ui/notifications/tool-cancelled')status.textContent=t('Request cancelled.','Το αίτημα ακυρώθηκε.');});
document.addEventListener('click',async e=>{const button=e.target.closest('[data-metric]');if(button){selectedMetric=button.dataset.metric;render();return}const a=e.target.closest('a');if(!a||!initialized)return;e.preventDefault();try{const result=await request('ui/open-link',{url:a.href});if(result?.isError)throw Error(t('The host could not open this link.','Ο client δεν άνοιξε τον σύνδεσμο.'))}catch(err){status.textContent=err.message}});
const observer=new ResizeObserver(()=>{if(initialized)notify('ui/notifications/size-changed',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)})});observer.observe(document.body);
if(window.parent!==window)request('ui/initialize',{appInfo:{name:CONFIG.name,version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(r=>{initialized=true;context(obj(r.hostContext));notify('ui/notifications/initialized',{});notify('ui/notifications/size-changed',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)})}).catch(()=>{status.textContent=t('The interactive view could not connect. The assistant still has the text result.','Η διαδραστική προβολή δεν συνδέθηκε. Ο βοηθός διαθέτει το αποτέλεσμα σε κείμενο.');});

document.addEventListener("error", e=>{if(e.target instanceof HTMLImageElement)e.target.hidden=true},true);
</script></body></html>
